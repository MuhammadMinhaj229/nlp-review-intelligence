services:
  - type: web
    name: nlp-backend
    env: python
    buildCommand: pip install setuptools wheel && pip install -r requirements.txt && pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.0/en_core_web_sm-3.7.0.tar.gz
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT

  - type: web
    name: nlp-frontend
    env: python
    buildCommand: pip install setuptools wheel && pip install -r requirements.txt && pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.0/en_core_web_sm-3.7.0.tar.gz
    startCommand: streamlit run app/streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: nlp-backend
          envVarKey: RENDER_EXTERNAL_URL
